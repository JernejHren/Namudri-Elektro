name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"  # weekly: catches breakage from new Home Assistant releases

permissions:
  contents: read

jobs:
  tests:
    name: Tests and typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Tests
        run: pytest --cov=custom_components.namudri_elektro --cov-report=term-missing
      - name: mypy --strict
        run: mypy --config-file mypy.ini custom_components/namudri_elektro

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # images are shipped in brand/ (Home Assistant 2026.3+), not in the brands repository
          ignore: brands
