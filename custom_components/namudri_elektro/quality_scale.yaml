# Self-assessment against the Home Assistant integration quality scale
# https://contributors.home-assistant.io/core/quality-scale/
# As a custom integration this has no official tier; every rule is done or
# exempt with a reason.
rules:
  # --- Bronze ---
  action-setup: done
  appropriate-polling:
    status: done
    comment: Nothing is polled; the coordinator follows the source sensors and a local 5 s timer.
  brands:
    status: done
    comment: Icon and logo (light and dark, 1x and 2x) are shipped in the brand/ folder, supported from Home Assistant 2026.3.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: The integration has no external requirements.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup:
    status: exempt
    comment: Entities do not subscribe to events; the coordinator does.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # --- Silver ---
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Nothing needs authentication.
  test-coverage: done

  # --- Gold ---
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: It computes from existing entities; there is nothing to discover.
  discovery-update-info:
    status: exempt
    comment: Nothing is discovered.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: No hardware; any power sensor in W and any tariff block sensor can be used.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One device per config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: done
    comment: The name and both source sensors can be changed from the entry menu (Reconfigure); the options flow still covers sensors, devices and notifications.
  repair-issues:
    status: done
    comment: A power sensor that stays unusable for 10 minutes and an unset agreed power in blocks 1-2 (while shedding is on and devices are chosen) raise repair issues that close themselves.
  stale-devices:
    status: exempt
    comment: One device per config entry.

  # --- Platinum ---
  async-dependency:
    status: exempt
    comment: No dependencies.
  inject-websession:
    status: exempt
    comment: No web requests.
  strict-typing:
    status: done
    comment: mypy --strict (mypy.ini) passes on the whole component and is part of the test routine.
